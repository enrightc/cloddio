<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloddio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <h1 class="site-title">Cloddio</h1>
    <div class="header-meta">
      <span class="season-label">Season 1 · Trench A</span>
      <span class="day-label">Day 1</span>
    </div>
    <div class="header-score">
      <span class="score-label">Score</span>
      <strong class="js-score">0</strong>
    </div>
  </header>

  <main class="game-layout">

    <!-- Left panel: Artefact Tray -->
    <aside class="panel panel--tray" aria-label="Artefact Tray">
      <div class="panel-header">
        <h2 class="panel-title">Artefact Tray</h2>
        <span class="panel-subtitle"><span class="js-tray-count">0</span> / 8 slots</span>
      </div>
      <div class="tray-grid"><!-- populated by game.js --></div>
      <div class="tray-actions">
        <button class="btn btn--ghost" id="btn-hint" disabled>Request Hint</button>
        <button class="btn btn--primary" id="btn-new-trench">New Trench</button>
      </div>
    </aside>

    <!-- Centre panel: Dig Site -->
    <section class="panel panel--site" aria-label="Dig Site">
      <div class="panel-header">
        <h2 class="panel-title">Dig Site</h2>
        <div class="site-controls">
          <button class="btn btn--tool btn--active" title="Trowel">&#x1FA9B;</button>
          <button class="btn btn--tool" title="Brush">&#x1F58C;&#xFE0F;</button>
          <button class="btn btn--tool" title="Sieve">&#x2B1C;</button>
        </div>
      </div>

      <div class="dig-viewport">
        <div class="stratigraphy-labels"><!-- populated by game.js --></div>
        <div class="dig-grid"><!-- populated by game.js --></div>
        <div class="depth-scale">
          <span>0 cm</span>
          <span>20</span>
          <span>40</span>
          <span>60</span>
          <span>80</span>
        </div>
      </div>

      <div class="excavation-progress">
        <div class="progress-track">
          <div class="progress-fill"></div>
        </div>
        <span class="progress-label">0 / 20 cells</span>
      </div>

      <ul class="field-notes-log" id="field-notes-log" aria-live="polite" aria-relevant="additions"></ul>

      <div class="site-status">
        <span class="status-item">Site: <strong class="js-site-name">—</strong></span>
        <span class="status-item">Period: <strong class="js-site-period">—</strong></span>
        <span class="status-item">Finds: <strong class="js-finds-count">0</strong></span>
      </div>
    </section>

    <!-- Right panel: Field Catalogue -->
    <aside class="panel panel--catalogue" aria-label="Field Catalogue">
      <div class="panel-header">
        <h2 class="panel-title">Field Catalogue</h2>
        <span class="panel-subtitle"><span class="js-catalogue-count">0</span> entries</span>
      </div>
      <div class="period-slots" id="period-slots"><!-- populated by game.js --></div>
      <div class="catalogue-footer">
        <button class="btn btn--ghost" disabled>Export Report</button>
      </div>
    </aside>

  </main>

  <!-- Artefact detail modal -->
  <div class="modal-overlay" id="artefact-modal">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-artefact-name">
      <button class="modal-close" aria-label="Close">&times;</button>
      <span class="modal-era js-modal-era"></span>
      <div class="modal-icon js-modal-icon"></div>
      <h2 class="modal-name js-modal-name" id="modal-artefact-name"></h2>
      <p class="modal-desc js-modal-desc"></p>
      <div class="modal-chips js-modal-chips"></div>
      <p class="modal-conservation js-modal-conservation"></p>
    </div>
  </div>

  <!-- Portrait lock overlay — visible only on touch devices in portrait mode -->
  <div class="portrait-lock" aria-hidden="true">
    <div class="portrait-lock__content">
      <div class="portrait-lock__icon">&#x21BA;</div>
      <p class="portrait-lock__heading">Rotate your device</p>
      <p class="portrait-lock__sub">Cloddio requires landscape orientation</p>
    </div>
  </div>

  <!-- Toast notification container -->
  <div id="toast-container" aria-live="assertive" aria-atomic="true"></div>

  <script src="data.js"></script>
  <script src="game.js"></script>
</body>
</html>
